<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#f0f9ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fafaf9" stop-opacity="0.4"/>
    </linearGradient>

    <!-- ポップドットパターン -->
    <pattern id="popDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.8" fill="#0284c7" opacity="0.08"/>
      <circle cx="0" cy="0" r="0.6" fill="#ea580c" opacity="0.06"/>
      <circle cx="16" cy="16" r="0.6" fill="#ea580c" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="210" height="297" fill="#fafaf9"/>
  <rect width="210" height="297" fill="url(#skyGrad)"/>
  <rect width="210" height="297" fill="url(#popDots)"/>

  <!-- 屋上サンシャイン＆ポップアクセント（四隅） -->
  <g opacity="0.12" fill="none">
    <!-- 左上 サンシャイン・アーク -->
    <circle cx="0" cy="0" r="18" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="28" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2,3"/>
    
    <!-- 右上 クラウド風アクセント -->
    <circle cx="210" cy="0" r="22" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="210" cy="0" r="34" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="3,3"/>
  </g>
</svg>
