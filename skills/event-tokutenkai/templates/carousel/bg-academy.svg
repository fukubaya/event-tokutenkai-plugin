<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="100%" height="100%">
  <defs>
    <linearGradient id="acadBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#eff6ff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- アカデミーチェックパターン -->
    <pattern id="argyle" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M15,0 L30,15 L15,30 L0,15 Z" fill="none" stroke="#1e3a8a" stroke-width="0.3" opacity="0.07"/>
      <path d="M0,0 L30,30 M30,0 L0,30" stroke="#d97706" stroke-width="0.2" stroke-dasharray="1,2" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="210" height="297" fill="url(#acadBg)"/>
  <rect width="210" height="297" fill="url(#argyle)"/>

  <!-- 四隅のゴールド＆ネイビースクール装飾ライン -->
  <g stroke="#1e3a8a" stroke-width="0.8" opacity="0.15" fill="none">
    <path d="M 6 20 L 6 6 L 20 6" />
    <path d="M 204 20 L 204 6 L 190 6" />
    <path d="M 6 277 L 6 291 L 20 291" />
    <path d="M 204 277 L 204 291 L 190 291" />
  </g>
  <g stroke="#d97706" stroke-width="0.5" opacity="0.2" fill="none">
    <circle cx="6" cy="6" r="3"/>
    <circle cx="204" cy="6" r="3"/>
    <circle cx="6" cy="291" r="3"/>
    <circle cx="204" cy="291" r="3"/>
  </g>
</svg>
