<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 115" width="100%" height="100%" style="display: block; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;">
  <!-- 背景全体（薄いベージュ／HMV会場フロア） -->
  <rect x="0" y="0" width="200" height="115" fill="#fefce8" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>

  <!-- 左側ステージエリア（鮮やかなスカイブルー） -->
  <rect x="0" y="0" width="40" height="115" fill="#00a3e0" rx="2"/>
  
  <!-- リリース日バッジ（左上斜めフラッグ） -->
  <path d="M 3 5 L 35 5 L 31 14 L 3 14 Z" fill="#1e3a8a"/>
  <text x="18" y="11.5" fill="#ffffff" font-size="4.2" font-weight="900" text-anchor="middle" letter-spacing="0.04em">リリース日</text>

  <!-- ステージロゴ＆テキスト -->
  <!-- ばってん少女隊シンボルアイコン風（サークル＆スター） -->
  <circle cx="20" cy="46" r="9" fill="#ffffff" fill-opacity="0.2"/>
  <text x="20" y="49" fill="#ffffff" font-size="7.5" font-weight="900" text-anchor="middle">★</text>
  <text x="20" y="63" fill="#ffffff" font-size="5.2" font-weight="900" text-anchor="middle">ばってん少女隊</text>
  <text x="20" y="73" fill="#ffffff" font-size="6.0" font-weight="900" text-anchor="middle" letter-spacing="0.05em">Stage</text>
  <text x="20" y="80" fill="#ffffff" font-size="3.4" font-weight="700" text-anchor="middle" opacity="0.9">（6F イベントスペースA）</text>

  <!-- 右側：観覧エリア -->
  <text x="122" y="62" fill="#334155" font-size="7.2" font-weight="900" text-anchor="middle">観覧エリア</text>

  <!-- 左手前（客席前方）：女性エリア（ピンクの角丸長方形） -->
  <rect x="42" y="66" width="54" height="46" fill="#f9a8d4" rx="5" stroke="#f472b6" stroke-width="0.8"/>
  <text x="69" y="88" fill="#ffffff" font-size="6.5" font-weight="900" text-anchor="middle">女性</text>
  <text x="69" y="96" fill="#ffffff" font-size="6.5" font-weight="900" text-anchor="middle">エリア</text>

  <!-- 右上：入場順案内ボックス（白背景・水色ボーダー） -->
  <rect x="74" y="6" width="120" height="46" fill="#ffffff" stroke="#93c5fd" stroke-width="0.7" rx="1.5"/>
  <text x="80" y="13" fill="#1e40af" font-size="4.2" font-weight="900">入場順</text>
  <text x="80" y="19" fill="#dc2626" font-size="3.8" font-weight="800">▼ 車椅子の方等</text>
  <text x="80" y="25" fill="#dc2626" font-size="3.8" font-weight="800">▼ 優先券所持者（整理番号順）</text>
  <text x="85" y="30.5" fill="#475569" font-size="3.5" font-weight="700">優先エリア・女性エリアご自身でお進みください</text>
  <text x="80" y="36.5" fill="#dc2626" font-size="3.8" font-weight="800">▼ 余裕あればフリー入場</text>
  <text x="80" y="44.5" fill="#2563eb" font-size="3.8" font-weight="800">※後方モニターも稼働予定です</text>
</svg>
