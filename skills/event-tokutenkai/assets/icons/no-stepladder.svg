<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Stepladder / Ladder -->
  <!-- Left leg -->
  <line x1="17" y1="12" x2="11" y2="38" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="27" y1="12" x2="33" y2="38" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top plate -->
  <line x1="15" y1="12" x2="29" y2="12" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Steps -->
  <line x1="15" y1="19" x2="29" y2="19" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="26" x2="31" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="33" x2="33" y2="33" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Prohibition sign -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#ef4444" stroke-width="4"/>
  <line x1="10" y1="10" x2="38" y2="38" stroke="#ef4444" stroke-width="4"/>
</svg>
