<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Smartphone Body -->
  <rect x="11" y="6" width="26" height="36" rx="4" fill="#334155"/>
  <rect x="14" y="10" width="20" height="26" rx="1.5" fill="#ffffff"/>
  <!-- Home notch -->
  <circle cx="24" cy="39" r="1.2" fill="#94a3b8"/>
  <!-- QR Code inside screen -->
  <!-- Top-left position marker -->
  <rect x="16" y="12" width="6" height="6" fill="#0f172a"/>
  <rect x="17.5" y="13.5" width="3" height="3" fill="#ffffff"/>
  <!-- Top-right position marker -->
  <rect x="26" y="12" width="6" height="6" fill="#0f172a"/>
  <rect x="27.5" y="13.5" width="3" height="3" fill="#ffffff"/>
  <!-- Bottom-left position marker -->
  <rect x="16" y="22" width="6" height="6" fill="#0f172a"/>
  <rect x="17.5" y="23.5" width="3" height="3" fill="#ffffff"/>
  <!-- Data bits -->
  <rect x="24" y="19" width="2.5" height="2.5" fill="#0f172a"/>
  <rect x="28" y="20" width="2" height="4" fill="#0f172a"/>
  <rect x="24" y="25" width="3.5" height="2" fill="#0f172a"/>
  <rect x="28.5" y="26" width="3" height="3" fill="#0f172a"/>
  <!-- Scan beam line -->
  <line x1="14" y1="21" x2="34" y2="21" stroke="#3b82f6" stroke-width="1.2" opacity="0.9"/>
</svg>
