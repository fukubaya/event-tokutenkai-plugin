<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Jumping Figure -->
  <circle cx="24" cy="14" r="3.5" fill="#64748b"/>
  <!-- Body & Arms up -->
  <path d="M16 16 L20 20 L24 23 L28 20 L32 16" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="21" x2="24" y2="28" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- Legs bent in jump -->
  <path d="M19 34 L21 28 L24 28 L27 28 L29 34" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Ground spring/jump lines -->
  <path d="M18 38 L24 36 L30 38" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Prohibition sign -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#ef4444" stroke-width="4"/>
  <line x1="10" y1="10" x2="38" y2="38" stroke="#ef4444" stroke-width="4"/>
</svg>
