<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Smartphone outline -->
  <rect x="15" y="8" width="18" height="32" rx="3.5" fill="#334155"/>
  <rect x="17" y="12" width="14" height="24" rx="1.5" fill="#e2e8f0"/>
  <!-- Screen Record Circle (Red dot with outer wave) -->
  <circle cx="24" cy="23" r="5" fill="#ef4444"/>
  <circle cx="24" cy="23" r="8" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- Home indicator -->
  <line x1="21" y1="38" x2="27" y2="38" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Prohibition sign -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#ef4444" stroke-width="4"/>
  <line x1="10" y1="10" x2="38" y2="38" stroke="#ef4444" stroke-width="4"/>
</svg>
